# Textos que o site acrescenta aos do tema: o cabeçalho de abertura (partials/masthead.html,
# compartilhado por artigos e páginas de episódio) e as páginas de episódio
# (layouts/episodes/single.html e partials/episode/).
# Ver i18n/en.toml. O Hugo combina este arquivo com o pt-BR.toml do tema.

# O cabeçalho de abertura. Genérico, não `episode.*`: um artigo e uma página de episódio
# usam o mesmo partial. As datas são escritas por extenso ("7 de outubro de 2026") pelo
# partial, no idioma da página, e chegam aqui prontas.
["masthead.by"]
other = "Por {{ . }}"
["masthead.readingTime"]
other = "{{ . }} min de leitura"
["masthead.updated"]
other = "Atualizado em {{ . }}"
["masthead.and"]
other = " e "
["masthead.basedOn"]
other = "Baseado em <strong>{{ .Title }}</strong>, com {{ .Hosts }}"
["masthead.released"]
other = "Publicado em {{ . }}"
["masthead.length"]
other = "{{ . }} min"
["masthead.writtenUp"]
other = "Escrito pelo Claude a partir da transcrição do episódio, em {{ . }}"

# O fim de um artigo (partials/single/footer.html e share.html). A linha de
# compartilhamento também aparece nas páginas de episódio.
["post.share"]
other = "Compartilhar"
["post.previous"]
other = "Anterior"
["post.next"]
other = "Próximo"

# As páginas de episódio.
["episode.mapLabel"]
other = "Mapa do episódio"
["episode.chapter"]
other = "Capítulo"
["episode.playFrom"]
other = "Ouvir a partir de {{ .Clock }} no {{ .Where }}"
["episode.listenHeading"]
other = "Ouça o episódio inteiro"
["episode.colophon"]
other = "Transcrito da gravação com o Whisper, e refeito nos trechos em que ele tropeçou. As citações foram ditas em inglês e traduzidas aqui. As aquarelas foram pintadas por um código que o Claude escreveu: polígonos deformados e sobrepostos em camadas transparentes, com pigmento que assenta no grão do papel e se acumula na borda de cada aguada, renderizados com OpenCV."

["episode.mapHeading"]
other = "Neste episódio"
["episode.minutes"]
other = "{{ . }} minutos"
["episode.intro"]
other = "Abertura"
["episode.of"]
other = "de {{ . }}"
["episode.lesson"]
other = "A lição"
["episode.disclaimer"]
other = "**Escrito pelo Claude, não pelo Italo.** O Claude, um modelo de IA da Anthropic, escreveu estes destaques a partir da transcrição do episódio. As citações são palavras do próprio Italo na gravação, traduzidas e com pequenos cortes, cada uma ligada ao segundo em que foi dita. Os resumos e as lições são a leitura do Claude, não textos do Italo, que estão em [Artigos]({{ .Writing }})."

# Figuras (partials/episode/ask.html e figure.html). Só as palavras genéricas
