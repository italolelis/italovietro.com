name: PR Checks

on:
  pull_request:
    branches: ["master"]

# Cancel in-progress runs when a new workflow with the same group name is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.153.2
      # Declared at job level, not step level: a step's own `env` block is not
      # reliably readable from that same step's `if` condition.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          fi

      - name: Cache Hugo resources
        uses: actions/cache@v4
        with:
          path: resources
          key: ${{ runner.os }}-hugo-resources-${{ hashFiles('**/*.md') }}
          restore-keys: |
            ${{ runner.os }}-hugo-resources-

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --gc \
            --minify

      - name: Check for build warnings
        run: |
          if [ -s hugo-build.log ]; then
            echo "⚠️ Build warnings found:"
            cat hugo-build.log
          fi

      - name: Assert build output
        run: ./scripts/check-build.sh public

      # Preview deploys are the reason for moving off Pages, so they run from
      # the same output the production deploy uses -- via the same script -- and
      # only after the assertions above pass.
      #
      # Skipped rather than failed when the Vercel secrets are absent, so the
      # build check keeps working for anyone without deploy access.
      - name: Deploy preview to Vercel
        id: preview
        if: env.VERCEL_TOKEN != ''
        run: |
          .github/scripts/vercel-output.sh public
          url=$(npx --yes vercel@latest deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Preview"
            echo ""
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"
