name: Deploy to Vercel

# Actions builds, Vercel hosts.
#
# The build happens here rather than on Vercel for one reason: the post-build
# assertions in scripts/check-build.sh gate production. If an assertion fails,
# the deploy step never runs. Letting Vercel's own Git integration build would
# publish whatever is on master regardless of whether those checks passed, so
# that integration is disabled in vercel.json.
#
# Vercel receives finished output via the Build Output API and runs no build of
# its own, which also means the Hugo version here is the only one that matters.

on:
  push:
    branches: ["master"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, assert, deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      HUGO_VERSION: 0.153.2
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          fi

      - name: Cache Hugo resources
        uses: actions/cache@v4
        with:
          path: resources
          key: ${{ runner.os }}-hugo-resources-${{ hashFiles('**/*.md') }}
          restore-keys: |
            ${{ runner.os }}-hugo-resources-

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: hugo --gc --minify

      # The gate. Nothing below this runs if an assertion fails.
      - name: Assert build output
        run: ./scripts/check-build.sh public

      - name: Prepare Vercel build output
        run: .github/scripts/vercel-output.sh

      - name: Deploy to Vercel
        id: deploy
        run: |
          url=$(npx --yes vercel@latest deploy --prebuilt --prod \
            --token="${{ secrets.VERCEL_TOKEN }}")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"
