baseURL = "https://italovietro.com"
defaultContentLanguage = "en"
theme = "LoveIt"

title = "Italo Vietro"

enableRobotsTXT = true
enableGitInfo = true
enableEmoji = true

# Suppress warnings
ignoreLogs = ['shortcode-twitter-getremote']

[languages]
  [languages.en]
    weight = 1
    languageCode = "en"
    languageName = "English"
    hasCJKLanguage = false
    copyright = "italo Vietro."
      
    [languages.en.menu]
      # Writing was missing entirely. Six published posts sat live and indexed at
      # /posts/ with nothing linking to them from the nav or the homepage, so a
      # visitor arriving at the domain had no path to any of them.
      [[languages.en.menu.main]]
        identifier = "writing"
        pre = ""
        post = ""
        name = "Writing"
        url = "/posts/"
        title = ""
        weight = 1
      [[languages.en.menu.main]]
        identifier = "reading-list"
        pre = ""
        post = ""
        name = "Reading"
        url = "/recommended-reading/"
        title = ""
        weight = 2
      [[languages.en.menu.main]]
        identifier = "speaking"
        pre = ""
        post = ""
        name = "Speaking"
        url = "/speaking/"
        title = ""
        weight = 3
      # The biography that used to run down the home page lives here now. Labels
      # stay one word per item in both languages, so the row reads as a set.
      [[languages.en.menu.main]]
        identifier = "about"
        pre = ""
        post = ""
        name = "About"
        url = "/about/"
        title = ""
        weight = 4
    [languages.en.pagination]
      disableAliases = true
      pagerSize = 12
    [languages.en.params]
      description = "My personal website"
      keywords = ["italolelis", "personal", "software"]
      # App icon config
      [languages.en.params.app]
        title = "Italo Vietro"
        noFavicon = false
        svgFavicon = "/images/logo.svg"
        themeColor = "#ffffff"
        iconColor = "#5bbad5"
        tileColor = "#da532c"
      # Home page config
      [languages.en.params.home]
        # amount of RSS pages
        rss = 10
        # Home page profile
        [languages.en.params.home.profile]
          enable = true
          gravatarEmail = ""
          # No portrait on the home page. Only 2 of the 14 sites surveyed in
          # .planning/research/minimal-personal-site-patterns.md show a face on
          # theirs, and both belong to people with something to sell. The photograph
          # now opens /about/, where a reader has asked to see who is writing.
          #
          # Empty rather than profile.enable = false: the tagline and the social row
          # come from this same block and both stay.
          avatarURL = ""
          # title shown in home page (HTML format is supported)
          title = ""
          # subtitle shown in home page
          subtitle = "The hardest problems aren't technical."
          # No typing animation. The tagline is the first line a visitor sees and
          # the only one above the fold, so it should be there at first paint
          # rather than arriving character by character behind a cursor that the
          # theme's `duration = -1` then left blinking forever.
          typeit = false
          # whether to show social links
          social = true
          # disclaimer (HTML format is supported)
          disclaimer = ""
        # Home page posts
        [languages.en.params.home.posts]
          enable = false
          # special amount of posts in each home posts page
          paginate = 6

  [languages.pt-br]
    weight = 2
    languageCode = "pt-BR"
    languageName = "Português"
    hasCJKLanguage = false
    copyright = "italovietro"
    [languages.pt-br.menu]
      [[languages.pt-br.menu.main]]
        identifier = "writing"
        pre = ""
        post = ""
        name = "Artigos"
        url = "/posts/"
        title = ""
        weight = 1
      [[languages.pt-br.menu.main]]
        identifier = "reading-list"
        pre = ""
        post = ""
        name = "Leituras"
        url = "/leituras-recomendadas/"
        title = ""
        weight = 2
      [[languages.pt-br.menu.main]]
        identifier = "palestras"
        pre = ""
        name = "Palestras"
        url = "/palestras/"
        title = ""
        weight = 3
      [[languages.pt-br.menu.main]]
        identifier = "about"
        pre = ""
        post = ""
        name = "Sobre"
        url = "/sobre/"
        title = ""
        weight = 4
    [languages.pt-br.pagination]
      disableAliases = true
      pagerSize = 12
    [languages.pt-br.params]
      description = "Meu site pessoal"
      keywords = ["italolelis", "personal", "software"]
      [languages.pt-br.params.app]
        title = "Italo Vietro"
        noFavicon = false
        svgFavicon = "/images/logo.svg"
        themeColor = "#ffffff"
        iconColor = "#5bbad5"
        tileColor = "#da532c"
      [languages.pt-br.params.home]
        rss = 10
        [languages.pt-br.params.home.profile]
          enable = true
          gravatarEmail = ""
          # See the en block above: the portrait moved to /pt-br/sobre/.
          avatarURL = ""
          title = ""
          subtitle = "Os problemas mais difíceis não são técnicos."
          # See the en block above.
          typeit = false
          social = true
          disclaimer = ""
        [languages.pt-br.params.home.posts]
          enable = false
          paginate = 6

[params]
  # LoveIt theme version
  version = "0.2.X"
  # site default theme ("light", "dark", "auto")
  defaultTheme = "auto"
  # public git repo url only then enableGitInfo is true
  gitRepo = "https://github.com/italolelis/italovietro.com"
  # which hash function used for SRI, when empty, no SRI is used ("sha256", "sha384", "sha512", "md5")
  fingerprint = "sha256"
  # date format
  dateFormat = "2006-01-02"
  # website images for Open Graph and Twitter Cards
  images = ["/images/logo.svg"]

  # Header config
  [params.header]
    # desktop header mode ("fixed", "normal", "auto")
    desktopMode = "fixed"
    # mobile header mode ("fixed", "normal", "auto")
    mobileMode = "auto"
    # Header title config
    [params.header.title]
      # URL of the LOGO
      logo = "images/logo.svg"
      # title name
      name = "Italo Vietro"
      # you can add extra information before the name (HTML format is supported), such as icons
      pre = ""
      # you can add extra information after the name (HTML format is supported), such as icons
      post = ""
      # whether to use typeit animation for title name
      typeit = false

  # Footer config
  [params.footer]
    enable = true
    # Custom content (HTML format is supported)
    custom = ''
    # whether to show Hugo and theme info
    hugo = false
    # whether to show copyright info
    copyright = true
    # whether to show the author
    author = true
    # site creation time
    since = 2021
    # ICP info only in China (HTML format is supported)
    icp = ""
    # license info (HTML format is supported)
    license= ''

  # Section (all posts) page config
  [params.section]
    # special amount of posts in each section page
    paginate = 20
    # The archive groups by year, so the year is already on screen. "January 2"
    # reads as a date; "01-02" reads as a code.
    dateFormat = "January 2"
    # amount of RSS pages
    rss = 10

  # List (category or tag) page config
  [params.list]
    # special amount of posts in each list page
    paginate = 20
    # Year-bearing, like the section format. Every dated site in the reference
    # survey shows the year without exception; "01-02" made a 2021 post read as
    # if it were published this year.
    dateFormat = "2006-01-02"
    # amount of RSS pages
    rss = 10

  # Page config
  [params.page]
    # whether to hide a page from home page
    hiddenFromHomePage = false
    # whether to hide a page from search results
    hiddenFromSearch = false
    # whether to enable twemoji
    twemoji = false
    # whether to enable lightgallery
    lightgallery = false
    # whether to enable the ruby extended syntax
    ruby = true
    # whether to enable the fraction extended syntax
    fraction = true
    # whether to enable the fontawesome extended syntax
    fontawesome = true
    # whether to show link to Raw Markdown content of the content
    linkToMarkdown = true
    # whether to show the full text content in RSS
    rssFullText = false
    # Table of the contents config
    [params.page.toc]
      enable = true
      keepStatic = false
      auto = true
    # Code config
    [params.page.code]
      copy = true
      maxShownLines = 10
    # KaTeX mathematical formulas config (KaTeX https://katex.org/)
    [params.page.math]
      enable = false
      blockLeftDelimiter = ""
      blockRightDelimiter = ""
      inlineLeftDelimiter = ""
      inlineRightDelimiter = ""
      copyTex = true
      mhchem = true
    # Mapbox GL JS config (Mapbox GL JS https://docs.mapbox.com/mapbox-gl-js)
    [params.page.mapbox]
      # access token of Mapbox GL JS
      accessToken = "pk.eyJ1IjoiZGlsbG9uenEiLCJhIjoiY2s2czd2M2x3MDA0NjNmcGxmcjVrZmc2cyJ9.aSjv2BNuZUfARvxRYjSVZQ"
      # style for the light theme
      lightStyle = "mapbox://styles/mapbox/light-v10?optimize=true"
      # style for the dark theme
      darkStyle = "mapbox://styles/mapbox/dark-v10?optimize=true"
      # whether to add NavigationControl (https://docs.mapbox.com/mapbox-gl-js/api/#navigationcontrol)
      navigation = true
      # whether to add GeolocateControl (https://docs.mapbox.com/mapbox-gl-js/api/#geolocatecontrol)
      geolocate = true
      # whether to add ScaleControl (https://docs.mapbox.com/mapbox-gl-js/api/#scalecontrol)
      scale = true
      # whether to add FullscreenControl (https://docs.mapbox.com/mapbox-gl-js/api/#fullscreencontrol)
      fullscreen = true
    # Social share links in post page
    #
    # Line and Weibo were theme defaults that arrived with the template rather than
    # choices. Neither is plausible for a readership that reads in English and
    # Portuguese, so a post page offered five buttons where three were meant.
    [params.page.share]
      enable = true
      Twitter = true
      Facebook = true
      Linkedin = false
      Whatsapp = false
      Pinterest = false
      Tumblr = false
      HackerNews = true
      Reddit = false
      VK = false
      Buffer = false
      Xing = false
      Line = false
      Instapaper = false
      Pocket = false
      Digg = false
      Stumbleupon = false
      Flipboard = false
      Weibo = false
      Renren = false
      Myspace = false
      Blogger = false
      Baidu = false
      Odnoklassniki = false
      Evernote = false
      Skype = false
      Trello = false
      Mix = false

    # Comment config
    [params.page.comment]
      enable = false

    # Third-party library config
    [params.page.library]
      [params.page.library.css]
        # someCSS = "some.css"
        # located in "assets/"
        # someCSS = "https://cdn.example.com/some.css"
      [params.page.library.js]
        # someJavascript = "some.js"
        # located in "assets/"
        # someJavascript = "https://cdn.example.com/some.js"
    # Page SEO config
    [params.page.seo]
      # image URL
      images = []
      # Publisher info
      [params.page.seo.publisher]
        name = "xxxx"
        # The portrait it used to point at is gone, and the mark is the right thing
        # for a publisher logo anyway. Raster, not the SVG: the theme resolves this
        # as an image resource and reads .Width off it, which an SVG cannot answer.
        logoUrl = "/images/logo.png"

  # TypeIt config
  [params.typeit]
    # typing speed between each step (measured in milliseconds)
    speed = 100
    # blinking speed of the cursor (measured in milliseconds)
    cursorSpeed = 1000
    # character used for the cursor (HTML format is supported)
    cursorChar = "|"
    # cursor duration after typing finishing (measured in milliseconds, "-1" means unlimited)
    duration = -1

  # Site verification code for Google/Bing/Yandex/Pinterest/Baidu
  [params.verification]
    google = ""
    bing = ""
    yandex = ""
    pinterest = ""
    baidu = ""

  # Site SEO config
  [params.seo]
    image = "/images/Apple-Devices-Preview.png"
    thumbnailUrl = "/images/screenshot.png"

  # Analytics config
  [params.analytics]
    enable = true
    # Vercel Web Analytics and Speed Insights.
    #
    # Replaces Google Analytics (was G-KYX115R541). Both are served from Vercel's
    # edge at /_vercel/*, need no npm package, and are rendered only in production
    # by layouts/partials/plugin/analytics.html. Both must also be enabled in the
    # Vercel project dashboard for data to be ingested.
    #
    # Unlike the Google tag, these are cookieless and collect no PII.
    [params.analytics.vercel]
      webAnalytics = true
      speedInsights = true

  # Cookie consent config
  #
  # Off, because there is nothing left to consent to. The banner existed for the
  # Google tag; with that gone the site sets no cookies at all -- verified: no
  # Set-Cookie header, and document.cookie appears nowhere in the built output.
  # Vercel Web Analytics and Speed Insights are cookieless and collect no PII.
  #
  # The only client-side storage left is localStorage in the theme's JS, holding
  # the light/dark preference the visitor set themselves.
  #
  # Disabling this also drops two third-party requests to jsDelivr for the
  # cookieconsent library's CSS and JS.
  #
  # The banner's palette settings are removed rather than left dead. If it is
  # ever re-enabled, recover them from git history -- they were tuned to fix a
  # 2.72:1 contrast failure in the theme's default #1aa3ff banner.
  [params.cookieconsent]
    enable = false

  # CDN config for third-party library files
  #
  # Empty on purpose. With a value ("jsdelivr.yml") the theme rewrites every
  # library URL to a public CDN; empty, it serves the copies it already ships in
  # themes/LoveIt/assets/lib/ from this origin, fingerprinted with SRI.
  #
  # Two reasons. Privacy: a CDN request hands the visitor's IP to a third party
  # on every page load, which no cookie banner ever covered. Speed: cross-origin
  # HTTP caches have been partitioned per-site in every major browser since 2020,
  # so a public CDN no longer buys a warm cache from some other site -- and
  # same-origin assets ride a connection that is already open.
  #
  # Cost is roughly 1.5MB added to the deploy, most of it FontAwesome webfonts.
  # Visitors download about the same bytes as before, just from here.
  [params.cdn]
    data = ""

  # Compatibility config
  [params.compatibility]
    polyfill = false
    objectFit = false

  [params.social]
    GitHub = "italolelis"
    Linkedin = "italolelis"
    Email = ""
    RSS = true

  # Author config
  [params.author]
    name = "Italo Vietro"
    email = "me@italovietro.com"
    link = ""
  
# Markup related configuration in Hugo
[markup]
  # Syntax Highlighting (https://gohugo.io/content-management/syntax-highlighting)
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = true
    lineNumbersInTable = true
    # false is a necessary configuration (https://github.com/dillonzq/LoveIt/issues/158)
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.extensions]
      definitionList = true
      footnote = true
      linkify = true
      strikethrough = true
      table = true
      taskList = true
      typographer = true
    [markup.goldmark.renderer]
      unsafe = true
  # Table Of Contents settings
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 6

# Sitemap config
[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

# Permalinks config (https://gohugo.io/content-management/urls/#permalinks)
[Permalinks]
  posts = ":contentbasename"

# Privacy config (https://gohugo.io/about/hugo-and-gdpr/)
[privacy]
  # No [privacy.googleAnalytics] block: Google Analytics was removed in favour of
  # Vercel Web Analytics, which is cookieless and sends nothing to Google.
  [privacy.x]
    enableDNT = true
  [privacy.youtube]
    privacyEnhanced = true

# Options to make output .md files
[mediaTypes]
  [mediaTypes."text/plain"]
    suffixes = ["md"]

# Options to make output .md files
[outputFormats.MarkDown]
  mediaType = "text/plain"
  isPlainText = true
  isHTML = false

# Options to make hugo output files
[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML", "MarkDown"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
