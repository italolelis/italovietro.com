# Writing published on other people's sites.
#
# The archive here stops in March 2021, which for five years read as "stopped
# writing". He did not -- the writing went to employer engineering blogs, to
# Medium, and to interviews, and none of it was reachable from this domain. A
# visitor checking whether he still thinks about this stuff found a dormant list of
# six posts and no reason to believe otherwise. There are more pieces here than in
# the archive itself, which is the honest shape of it.
#
# Deliberately NOT listed: "5 ways to keep up with code as an Engineering Manager"
# (Medium, Aug 2018). It is already a post on this site -- the same piece,
# cross-posted -- and listing it twice would inflate this list with something the
# reader can already reach.
#
# Rendered by layouts/_default/section.html, merged into the same year groups as
# the posts written here and sorted with them. The `host` below is what tells the
# two apart on the page: a row carrying one was published elsewhere, a row without
# one is here. Language-neutral on purpose -- these are titles, hosts and dates, and
# the pieces are in English regardless of which version of the site you are reading.
#
# `date` both sorts and prints -- formatted with the same site-level format the
# posts use, so a Medium piece and a post from the same month read identically.

